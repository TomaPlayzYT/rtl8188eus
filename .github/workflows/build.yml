name: Build Android GKI 5.15 Module

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Driver Source
        uses: actions/checkout@v4

      - name: Set up AOSP android13-5.15 Kernel Headers & Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libelf-dev clang lld llvm
          git clone --depth 1 https://android.googlesource.com/kernel/common -b android13-5.15 common
          cd common && make ARCH=arm64 gki_defconfig prepare modules_prepare
          
      - name: Compile 8188eu.ko Module
        run: |
          make ARCH=arm64 LLVM=1 -C common M=$(pwd) modules

      - name: Upload 8188eu.ko Artifact
        uses: actions/upload-artifact@v4
        with:
          name: 8188eu-GKI-5.15
          path: 8188eu.ko
          
