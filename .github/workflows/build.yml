name: Build 8188eu Driver Module

on:
  workflow_dispatch:
    inputs:
      kernel_version:
        description: 'Target uname -r'
        required: true
        default: '5.15.189-android13-8-00018-g9c82b71884fd-ab14885418'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Install Dependencies & Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu build-essential bc bison flex libssl-dev git

      - name: Clone Driver Source
        run: |
          git clone https://github.com/aircrack-ng/rtl8188eus.git driver

      - name: Build Module
        run: |
          cd driver
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- KBUILD_KVER=${{ github.event.inputs.kernel_version }} -j$(nproc)

      - name: Upload 8188eu.ko Artifact
        uses: actions/upload-artifact@v4
        with:
          name: 8188eu-module
          path: driver/8188eu.ko
