      - name: Build 8188eu module
        run: |
          set -eux

          make \
            -C driver \
            KLIB_BUILD="$GITHUB_WORKSPACE/kernel" \
            KSRC="$GITHUB_WORKSPACE/kernel" \
            ARCH="$ARCH" \
            CROSS_COMPILE="$CROSS_COMPILE" \
            LLVM=1 \
            LLVM_IAS=1 \
            CC=clang \
            LD=ld.lld \
            -j"$(nproc)"

          echo "Built kernel modules:"
          find driver -type f -name "*.ko" -print

      - name: Find module
        run: |
          set -eux

          MODULE="$(
            find driver \
              -type f \
              -name "*.ko" \
              | head -n 1
          )"

          if [ -z "$MODULE" ]; then
            echo "No kernel module was produced."
            find driver -maxdepth 3 -type f | sort
            exit 1
          fi

          mkdir -p output

          echo "Found module: $MODULE"
          cp "$MODULE" output/8188eu.ko

          file output/8188eu.ko
