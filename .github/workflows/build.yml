name: Build rtl8188eu for Moto G77

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            build-essential \
            clang \
            llvm \
            lld \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            dwarves \
            git

      - name: Clone rtl8188eus
        run: |
          git clone \
            --branch v5.7.6.1 \
            --depth 1 \
            https://github.com/aircrack-ng/rtl8188eus.git

      - name: Clone Moto G77 kernel
        run: |
          git clone \
            https://github.com/MotorolaMobilityLLC/kernel-mtk.git \
            kernel

          cd kernel

          git fetch --all --tags

          git log --all --oneline --decorate \
            --grep='g9c82b71884fd' \
            -n 5

      - name: Verify target kernel
        working-directory: kernel
        run: |
          echo "Target:"
          echo "5.15.189-android13-8-00018-g9c82b71884fd-ab14885418"

          make -s kernelversion || true

      - name: Build 8188eu
        working-directory: rtl8188eus
        run: |
          make clean || true

          make -j$(nproc) \
            KSRC=$GITHUB_WORKSPACE/kernel \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            LLVM=1

      - name: Check module
        working-directory: rtl8188eus
        run: |
          test -f 8188eu.ko
          modinfo 8188eu.ko | grep -E '^(filename|vermagic):'

      - name: Upload 8188eu.ko
        uses: actions/upload-artifact@v4
        with:
          name: 8188eu-moto-g77
          path: rtl8188eus/8188eu.ko