name: Build Android GKI 5.15 Module

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Driver Source (Modern Fork)
        uses: actions/checkout@v4
        with:
          repository: 'KanuX-14/rtl8188eus'

      - name: Set up Build Dependencies & Toolchains
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libelf-dev clang lld llvm gcc-aarch64-linux-gnu

      - name: Fetch Android 13-5.15 GKI Kernel Headers & Patch Driver
        run: |
          git clone --depth 1 https://android.googlesource.com/kernel/common -b android13-5.15 common
          cd common
          make ARCH=arm64 LLVM=1 CROSS_COMPILE=aarch64-linux-gnu- gki_defconfig prepare modules_prepare
          
          # Cleanly overwrite the version macro instead of duplicating it
          sed -i 's/#define LINUX_VERSION_CODE .*/#define LINUX_VERSION_CODE 393984/' include/generated/uapi/linux/version.h

          # Fix uninitialized variable compiler warnings in rtw_recv.h
          cd ../include
          sed -i 's/_buffer \*buf_desc;/_buffer *buf_desc = NULL;/' rtw_recv.h
          sed -i 's/u8 \*buf_star;/u8 *buf_star = NULL;/' rtw_recv.h

      - name: Compile 8188eu.ko Module
        run: |
          make ARCH=arm64 LLVM=1 CROSS_COMPILE=aarch64-linux-gnu- KSRC=$(pwd)/common

      - name: Upload 8188eu.ko Artifact
        uses: actions/upload-artifact@v4
        with:
          name: 8188eu-GKI-5.15
          path: '*.ko'
          
