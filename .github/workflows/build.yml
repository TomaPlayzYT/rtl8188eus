name: Fast Build RTL8188EUS for Android GKI 5.15

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    name: Build Kernel Module
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential curl flex git libssl-dev \
          libelf-dev unzip python3 crossbuild-essential-arm64 kmod cpio lld llvm

      - name: Download Clang
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang $GITHUB_WORKSPACE/clang

      - name: Clone GKI 5.15 Kernel Source
        run: |
          git clone --depth 1 -b android14-5.15 https://android.googlesource.com/kernel/common $GITHUB_WORKSPACE/kernel

      - name: Clone RTL8188EUS Source
        run: |
          git clone --depth 1 https://gitlab.com/SimplyCEO/rtl8188eus.git $GITHUB_WORKSPACE/rtl8188eus

      - name: Prepare Kernel Headers (Instant)
        run: |
          export PATH=$GITHUB_WORKSPACE/clang/bin:$PATH
          cd $GITHUB_WORKSPACE/kernel
          mkdir -p out
          make O=out ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-gnu- gki_defconfig
          make O=out ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-gnu- modules_prepare -j$(nproc)
          
          SYMFILE=$(find $GITHUB_WORKSPACE -maxdepth 3 -name "*.symvers*" | head -n 1)
          
          if [ -n "$SYMFILE" ]; then
            echo "Found uploaded symvers at: $SYMFILE"
            cp "$SYMFILE" "$GITHUB_WORKSPACE/kernel/out/Module.symvers"
          else
            echo "No uploaded symvers found. Fetching from Android prebuilts using Python..."
            python3 -c "import urllib.request, base64; url='https://android.googlesource.com/kernel/prebuilts/5.15/arm64/+/refs/heads/main/Module.symvers?format=TEXT'; data=urllib.request.urlopen(url).read(); open('$GITHUB_WORKSPACE/kernel/out/Module.symvers', 'wb').write(base64.b64decode(data))"
          fi

      - name: Build RTL8188EUS Module
        run: |
          export PATH=$GITHUB_WORKSPACE/clang/bin:$PATH
          cd $GITHUB_WORKSPACE/rtl8188eus
          make ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-gnu- -j$(nproc) KSRC=$GITHUB_WORKSPACE/kernel/out CONFIG_PLATFORM_I386_PC=n CONFIG_PLATFORM_ARM_AARCH64=y CONFIG_PLATFORM_ARM64=y CONFIG_LITTLE_ENDIAN=y USER_EXTRA_CFLAGS="-DCONFIG_LITTLE_ENDIAN -Wno-error -Wno-unused-variable -Wno-parentheses-equality -Wno-undef" EXTRA_CFLAGS="-DCONFIG_LITTLE_ENDIAN -Wno-error -Wno-unused-variable -Wno-parentheses-equality -Wno-undef"

      - name: Upload Module Artifact
        uses: actions/upload-artifact@v4
        with:
          name: 8188eu-gki-5.15.ko
          path: ${{ github.workspace }}/rtl8188eus/8188eu.ko
