name: Build Android GKI 5.15 Module

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libelf-dev gcc-aarch64-linux-gnu

      - name: Fetch Android 13-5.15 GKI Kernel Source
        run: |
          git clone --depth 1 https://android.googlesource.com/kernel/common -b android13-5.15 kernel-common
          cd kernel-common
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- gki_defconfig
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- modules_prepare
          cd ..

      - name: Compile 8188eu.ko
        run: |
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- -C kernel-common M=$(pwd) modules

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: 8188eu-GKI-5.15
          path: '*.ko'
