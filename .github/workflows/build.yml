name: Build and upload 8188eu.ko

on:
  workflow_dispatch:

env:
  KERNEL_REPO: https://github.com/MotorolaMobilityLLC/kernel-mtk.git
  KERNEL_REF: android-16-release-w1wn36.18-114
  KERNEL_DEFCONFIG: gki_defconfig
  ARCH: arm64
  CROSS_COMPILE: aarch64-linux-gnu-

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout RTL8188EUS source
        uses: actions/checkout@v5

      - name: Install build dependencies
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            clang \
            flex \
            gcc-aarch64-linux-gnu \
            git \
            libelf-dev \
            libssl-dev \
            lld \
            llvm \
            make \
            python3 \
            dwarves \
            zip

      - name: Clone kernel
        run: |
          set -eux

          git clone \
            --depth=1 \
            --branch "$KERNEL_REF" \
            "$KERNEL_REPO" \
            kernel

          test -f kernel/Makefile

      - name: Configure kernel
        run: |
          set -eux

          cd kernel

          make \
            ARCH="$ARCH" \
            CROSS_COMPILE="$CROSS_COMPILE" \
            LLVM=1 \
            LLVM_IAS=1 \
            "$KERNEL_DEFCONFIG"

          ./scripts/config --enable CONFIG_WLAN
          ./scripts/config --enable CONFIG_CFG80211
          ./scripts/config --enable CONFIG_MAC80211
          ./scripts/config --enable CONFIG_USB

          make \
            ARCH="$ARCH" \
            CROSS_COMPILE="$CROSS_COMPILE" \
            LLVM=1 \
            LLVM_IAS=1 \
            olddefconfig

          grep -E \
            "CONFIG_(WLAN|CFG80211|MAC80211)" \
            .config

      - name: Prepare kernel
        run: |
          set -eux

          make \
            -C kernel \
            ARCH="$ARCH" \
            CROSS_COMPILE="$CROSS_COMPILE" \
            LLVM=1 \
            LLVM_IAS=1 \
            modules_prepare

      - name: Get kernel release
        run: |
          set -eux

          KERNEL_RELEASE="$(
            make \
              -s \
              -C kernel \
              ARCH="$ARCH" \
              CROSS_COMPILE="$CROSS_COMPILE" \
              LLVM=1 \
              LLVM_IAS=1 \
              kernelrelease
          )"

          echo "KERNEL_RELEASE=$KERNEL_RELEASE" >> "$GITHUB_ENV"

          echo "Kernel release:"
          echo "$KERNEL_RELEASE"

      - name: Build RTL8188EUS module
        run: |
          set -eux

          make \
            ARCH="$ARCH" \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CC=clang \
            LD=ld.lld \
            LLVM=1 \
            LLVM_IAS=1 \
            KSRC="$GITHUB_WORKSPACE/kernel" \
            KVER="$KERNEL_RELEASE" \
            -j"$(nproc)"

      - name: Locate 8188eu.ko
        run: |
          set -eux

          find . \
            -type f \
            -name "*.ko" \
            -print

          MODULE="$(
            find . \
              -type f \
              \( \
                -name "8188eu.ko" \
                -o \
                -name "r8188eu.ko" \
              \) \
              | head -n 1
          )"

          if [ -z "$MODULE" ]; then
            echo "8188eu.ko was not built."
            exit 1
          fi

          mkdir -p output
          cp "$MODULE" output/8188eu.ko

          file output/8188eu.ko
          readelf -h output/8188eu.ko \
            | grep -E "Class|Machine"

      - name: Create ZIP
        run: |
          set -eux

          printf '%s\n' \
            "RTL8188EUS driver" \
            "Module: 8188eu.ko" \
            "Kernel release: $KERNEL_RELEASE" \
            "Kernel branch: $KERNEL_REF" \
            > output/README.txt

          cd output
          zip -r ../rtl8188eus-ko.zip .

      - name: Upload 8188eu.ko
        uses: actions/upload-artifact@v4
        with:
          name: rtl8188eus-ko
          path: |
            rtl8188eus-ko.zip
            output/8188eu.ko
            output/README.txt
          if-no-files-found: error
