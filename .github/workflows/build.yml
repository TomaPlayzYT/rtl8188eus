name: Build 8188eu for android13-5.15

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout driver source
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libelf-dev \
            clang lld llvm gcc-aarch64-linux-gnu git python3 rsync cpio libncurses-dev

      - name: Clone android13-5.15 GKI kernel
        run: |
          git clone --depth=1 --branch android13-5.15 \
            https://android.googlesource.com/kernel/common.git kernel

      - name: Prepare kernel
        run: |
          cd kernel
          make -j$(nproc) ARCH=arm64 LLVM=1 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-gnu- gki_defconfig
          make -j$(nproc) ARCH=arm64 LLVM=1 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-gnu- prepare modules_prepare

      - name: Build 8188eu.ko
        run: |
          make -j$(nproc) \
            -C $GITHUB_WORKSPACE/kernel \
            M=$GITHUB_WORKSPACE \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CONFIG_RTL8188EU=m \
            CONFIG_PLATFORM_I386_PC=n \
            CONFIG_PLATFORM_ARM_AARCH64=y \
            CONFIG_IOCTL_CFG80211=y \
            KCFLAGS="-DCONFIG_LITTLE_ENDIAN -DCONFIG_IOCTL_CFG80211=1 -Wno-error" \
            modules

      - name: Find and upload module
        run: |
          mkdir -p out
          MODULE=$(find . -name "*.ko" ! -path "./kernel/*" | head -n1)
          if [ -z "$MODULE" ]; then
            echo "No .ko found!"
            find . -name "*.ko" || true
            exit 1
          fi
          echo "Found: $MODULE"
          cp "$MODULE" out/8188eu.ko
          file out/8188eu.ko
          ls -lh out/8188eu.ko

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: 8188eu-android13-5.15
          path: out/8188eu.ko
          if-no-files-found: error