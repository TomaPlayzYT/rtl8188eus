      - name: Clone RTL8188EUS driver
        run: |
          set -eux

          git clone \
            --depth=1 \
            https://gitlab.com/SimplyCEO/rtl8188eus.git \
            driver

          test -f driver/Makefile

      - name: Build 8188eu module
        run: |
          set -eux

          cd driver

          make clean || true

          make \
            KSRC="$GITHUB_WORKSPACE/kernel" \
            ARCH="$ARCH" \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CC=clang \
            LD=ld.lld \
            LLVM=1 \
            LLVM_IAS=1 \
            -j"$(nproc)"

          find . -type f -name "*.ko" -print

      - name: Package module
        run: |
          set -eux

          MODULE="$(
            find driver \
              -type f \
              -name "*.ko" \
              | head -n 1
          )"

          if [ -z "$MODULE" ]; then
            echo "Build completed but no .ko file exists."
            exit 1
          fi

          mkdir -p output
          cp "$MODULE" output/8188eu.ko
          file output/8188eu.ko

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rtl8188eus-ko
          path: output/8188eu.ko
          if-no-files-found: error
