name: Build Android GKI 5.15 Module

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Build Dependencies
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            clang \
            lld \
            llvm \
            gcc-aarch64-linux-gnu \
            git

      - name: Fetch Motorola Kernel and Prepare Headers
        run: |
          set -eux
          git clone \
            --depth=1 \
            --branch android-16-release-w1wn36.18-114 \
            https://github.com/MotorolaMobilityLLC/kernel-mtk.git \
            kernel

          cd kernel
          make \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            gki_defconfig

          make \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            prepare \
            modules_prepare

      - name: Compile 8188eu.ko Module
        run: |
          set -eux
          make \
            -C "$GITHUB_WORKSPACE/kernel" \
            M="$GITHUB_WORKSPACE" \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CONFIG_RTL8188EU=m \
            CONFIG_PLATFORM_I386_PC=n \
            CONFIG_PLATFORM_ARM_AARCH64=y \
            CONFIG_IOCTL_CFG80211=y \
            USER_EXTRA_CFLAGS="-DCONFIG_LITTLE_ENDIAN" \
            KCFLAGS="-DCONFIG_LITTLE_ENDIAN -Wno-error" \
            modules

      - name: Prepare Artifact
        run: |
          set -eux
          mkdir -p "$GITHUB_WORKSPACE/out"

          # Search for any .ko file produced outside the kernel directory
          MODULE="$(find "$GITHUB_WORKSPACE" -type f -name "*.ko" ! -path "$GITHUB_WORKSPACE/kernel/*" | head -n 1)"

          if [ -z "$MODULE" ]; then
            echo "=== ERROR: No module .ko file was produced ==="
            echo "Directory layout:"
            ls -la "$GITHUB_WORKSPACE"
            exit 1
          fi

          echo "Found compiled module: $MODULE"
          cp "$MODULE" "$GITHUB_WORKSPACE/out/8188eu.ko"

      - name: Verify Module
        run: |
          set -eux
          test -f "$GITHUB_WORKSPACE/out/8188eu.ko"
          file "$GITHUB_WORKSPACE/out/8188eu.ko"

      - name: Upload 8188eu.ko Artifact
        uses: actions/upload-artifact@v4
        with:
          name: 8188eu-GKI-5.15
          path: out/8188eu.ko
          if-no-files-found: error
