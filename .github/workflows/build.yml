name: Build Android GKI 5.15 Module

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Build Dependencies & Toolchains
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            clang \
            lld \
            llvm \
            gcc-aarch64-linux-gnu

      - name: Fetch Android 13-5.15 GKI Kernel & Prepare Headers
        run: |
          git clone --depth 1 https://android.googlesource.com/kernel/common -b android13-5.15 kernel
          cd kernel
          make ARCH=arm64 LLVM=1 CROSS_COMPILE=aarch64-linux-gnu- gki_defconfig prepare modules_prepare
          cd ..

      - name: Compile 8188eu.ko Module (GKI 5.15, arm64)
        run: |
          make -C $(pwd)/kernel M=$(pwd) ARCH=arm64 LLVM=1 CROSS_COMPILE=aarch64-linux-gnu- modules 2>&1 | tee build.log

      - name: Find .ko file location
        run: |
          echo "Searching for all .ko files..."
          find $(pwd) -name "*.ko" -type f 2>/dev/null | head -20
          echo ""
          echo "Current directory contents:"
          ls -la $(pwd)
          echo ""
          echo "Kernel directory contents:"
          ls -la $(pwd)/kernel 2>/dev/null | grep -E "\.ko|total" || echo "No .ko files in kernel dir"

      - name: Upload 8188eu.ko Artifact
        uses: actions/upload-artifact@v4
        with:
          name: 8188eu-GKI-5.15
          path: |
            **/*.ko
            build.log
          if-no-files-found: warn
