name: Find Moto G77 kernel branch

on:
  workflow_dispatch:

jobs:
  test-kernel-branch:
    name: Test ${{ matrix.kernel_ref }}
    runs-on: ubuntu-22.04
    continue-on-error: true

    strategy:
      fail-fast: false
      matrix:
        kernel_ref:
          - android-16-release-w1ucs36h.96-24-4-5
          - android-16-release-w1vc36h.14-20-1
          - android-16-release-w1ve36h.10-12r3
          - android-16-release-w1vns36h.60-66-4
          - android-16-release-w1vns36h.60-82-1
          - android-16-release-w1vo36.88-36-7
          - android-16-release-w1vvs36h.7-108-8-3
          - android-16-release-w1wn36.18-114
          - android-16-release-w3wg36.67-30-15
          - android-16-release-w3wm36.40-46-2

    env:
      KERNEL_REPO: https://github.com/MotorolaMobilityLLC/kernel-mtk.git
      EXPECTED_KERNEL: 5.15.189-android13-8-00018-g9c82b71884fd-ab14885418

    steps:
      - name: Install build dependencies
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            clang \
            flex \
            gcc-aarch64-linux-gnu \
            git \
            libelf-dev \
            libssl-dev \
            lld \
            llvm \
            make \
            python3 \
            dwarves

      - name: Clone kernel branch
        env:
          KERNEL_REF: ${{ matrix.kernel_ref }}
        run: |
          set -eux

          git clone \
            --depth=1 \
            --branch "$KERNEL_REF" \
            "$KERNEL_REPO" \
            kernel

          test -f kernel/Makefile

      - name: Find ARM64 defconfig
        run: |
          set -eux

          cd kernel

          DEFCONFIG="$(
            find arch/arm64/configs \
              -maxdepth 1 \
              -type f \
              | grep -Ei \
                'gki|w1|w3|mtk|6835|defconfig' \
              | head -n 1
          )"

          if [ -z "$DEFCONFIG" ]; then
            echo "No likely ARM64 defconfig found."
            find arch/arm64/configs \
              -maxdepth 1 \
              -type f \
              -print \
              | head -100
            exit 1
          fi

          DEFCONFIG_NAME="$(basename "$DEFCONFIG")"

          echo "Selected defconfig:"
          echo "$DEFCONFIG_NAME"

          echo "DEFCONFIG_NAME=$DEFCONFIG_NAME" \
            >> "$GITHUB_ENV"

      - name: Configure kernel
        run: |
          set -eux

          make \
            -C kernel \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            LLVM=1 \
            LLVM_IAS=1 \
            "$DEFCONFIG_NAME"

      - name: Read kernel release
        run: |
          set -eux

          KERNEL_RELEASE="$(
            make \
              -s \
              -C kernel \
              ARCH=arm64 \
              CROSS_COMPILE=aarch64-linux-gnu- \
              LLVM=1 \
              LLVM_IAS=1 \
              kernelrelease
          )"

          echo "Branch:"
          echo "${{ matrix.kernel_ref }}"

          echo "Kernel release:"
          echo "$KERNEL_RELEASE"

          echo "Expected release:"
          echo "$EXPECTED_KERNEL"

          {
            echo "## Branch: ${{ matrix.kernel_ref }}"
            echo
            echo "\`$KERNEL_RELEASE\`"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "$KERNEL_RELEASE" == \
            "$EXPECTED_KERNEL"* ]]; then
            echo "MATCH FOUND"
            echo "MATCHING_BRANCH=${{ matrix.kernel_ref }}" \
              >> "$GITHUB_ENV"
          else
            echo "Not a match."
          fi

      - name: Check match
        run: |
          if [ -n "${MATCHING_BRANCH:-}" ]; then
            echo "MATCHING BRANCH:"
            echo "$MATCHING_BRANCH"
          else
            echo "This branch does not match the phone kernel."
          fi
