name: Build 8188eu for Moto G77

on:
  workflow_dispatch:

env:
  KERNEL_REPO: https://github.com/MotorolaMobilityLLC/kernel-mtk.git
  KERNEL_REF: android-13-release-t1tn33.14-90-9
  KERNEL_DEFCONFIG: gki_defconfig

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout RTL8188EUS driver
        uses: actions/checkout@v5

      - name: Install build dependencies
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            clang \
            flex \
            gcc-aarch64-linux-gnu \
            git \
            libelf-dev \
            libssl-dev \
            lld \
            llvm \
            make \
            python3 \
            dwarves \
            zip

      - name: Clone Moto G77 kernel
        run: |
          set -eux

          git clone \
            --depth=1 \
            --branch "$KERNEL_REF" \
            "$KERNEL_REPO" \
            kernel

          test -f kernel/Makefile

      - name: Check kernel defconfig
        run: |
          set -eux

          cd kernel

          if [ ! -f "arch/arm64/configs/$KERNEL_DEFCONFIG" ]; then
            echo "Defconfig not found:"
            echo "arch/arm64/configs/$KERNEL_DEFCONFIG"
            echo
            echo "Available likely defconfigs:"
            find arch/arm64/configs \
              -maxdepth 1 \
              -type f \
              | grep -Ei "gki|mtk|6835|t1tn|defconfig" \
              || true
            exit 1
          fi

      - name: Configure kernel
        run: |
          set -eux

          cd kernel

          make \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            "$KERNEL_DEFCONFIG"

          test -x scripts/config

          ./scripts/config --enable CONFIG_WLAN
          ./scripts/config --enable CONFIG_CFG80211
          ./scripts/config --enable CONFIG_MAC80211
          ./scripts/config --enable CONFIG_USB

          if grep -Rqs \
            "config WLAN_VENDOR_REALTEK" \
            drivers/net/wireless \
            2>/dev/null; then
            ./scripts/config --enable CONFIG_WLAN_VENDOR_REALTEK
          fi

          make \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            olddefconfig

          echo "Kernel wireless configuration:"
          grep -E \
            "CONFIG_(WLAN|CFG80211|MAC80211|WLAN_VENDOR_REALTEK)" \
            .config \
            || true

          grep -q "^CONFIG_WLAN=y" .config
          grep -q "^CONFIG_CFG80211=y" .config
          grep -q "^CONFIG_MAC80211=y" .config

      - name: Prepare kernel
        run: |
          set -eux

          make \
            -C kernel \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            modules_prepare

      - name: Build RTL8188EUS driver
        run: |
          set -eux

          KERNEL_DIR="$GITHUB_WORKSPACE/kernel"

          KERNEL_RELEASE="$(
            make \
              -s \
              -C "$KERNEL_DIR" \
              ARCH=arm64 \
              LLVM=1 \
              kernelrelease
          )"

          echo "Kernel release:"
          echo "$KERNEL_RELEASE"

          make \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            KSRC="$KERNEL_DIR" \
            KVER="$KERNEL_RELEASE" \
            -j"$(nproc)"

      - name: Find compiled module
        run: |
          set -eux

          find . \
            -type f \
            -name "*.ko" \
            -print

          MODULE="$(
            find . \
              -type f \
              \( \
                -name "8188eu.ko" \
                -o \
                -name "r8188eu.ko" \
              \) \
              | head -n 1
          )"

          if [ -z "$MODULE" ]; then
            echo "ERROR: No RTL8188EUS module was produced."
            exit 1
          fi

          mkdir -p output

          cp "$MODULE" output/8188eu.ko

          echo "Built module:"
          file output/8188eu.ko

          echo "Module architecture:"
          readelf -h output/8188eu.ko \
            | grep -E "Class|Machine"

      - name: Copy RTL8188EUS firmware
        run: |
          set -eux

          mkdir -p output/firmware

          find . \
            -type f \
            \( \
              -iname "rtl8188eufw.bin" \
              -o \
              -iname "rtl8188eufw_*.bin" \
              -o \
              -iname "rtl8188eufw*.bin" \
            \) \
            -exec cp {} output/firmware/ \; \
            || true

      - name: Create driver loader
        run: |
          set -eux

          cat > output/load-driver.sh <<'EOF'
#!/system/bin/sh

MODDIR="$(CDPATH= cd -- "$(dirname -- "$0")" && pwd)"
MODULE="$MODDIR/8188eu.ko"

if [ ! -f "$MODULE" ]; then
    echo "8188eu.ko not found"
    exit 1
fi

insmod "$MODULE"

sleep 2

ip link
EOF

          chmod +x output/load-driver.sh

      - name: Create README
        run: |
          set -eux

          cat > output/README.txt <<'EOF'
RTL8188EUS Android driver

Target adapter:
TP-Link TL-WN722N v3

Target architecture:
arm64

Target kernel branch:
android-13-release-t1tn33.14-90-9

The module must match the running phone kernel's:
- kernel release
- vermagic
- exported symbols
- configuration

Do not load this module on a different kernel.

Kernel module:
8188eu.ko

Firmware location:
 /system/etc/firmware/rtlwifi/
EOF

      - name: Create ZIP archive
        run: |
          set -eux

          cd output

          zip -r \
            ../rtl8188eus-moto-g77.zip \
            .

      - name: Upload compiled driver
        uses: actions/upload-artifact@v4
        with:
          name: rtl8188eus-moto-g77
          path: |
            rtl8188eus-moto-g77.zip
            output/8188eu.ko
            output/load-driver.sh
            output/README.txt
          if-no-files-found: error
