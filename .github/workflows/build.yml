name: Fast Build RTL8188EUS for Android GKI 5.15

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    name: Build Kernel Module
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential curl flex git libssl-dev \
          libelf-dev unzip python3 crossbuild-essential-arm64 kmod cpio lld llvm

      - name: Download Clang
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang $GITHUB_WORKSPACE/clang

      - name: Clone GKI 5.15 Kernel Source
        run: |
          git clone --depth 1 -b android14-5.15 https://android.googlesource.com/kernel/common $GITHUB_WORKSPACE/kernel

      - name: Clone RTL8188EUS Source
        run: |
          git clone --depth 1 https://gitlab.com/SimplyCEO/rtl8188eus.git $GITHUB_WORKSPACE/rtl8188eus

      - name: Prepare Kernel Headers (Instant)
        run: |
          export PATH=$GITHUB_WORKSPACE/clang/bin:$PATH
          cd $GITHUB_WORKSPACE/kernel
          mkdir -p out
          make O=out ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-gnu- gki_defconfig
          make O=out ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-gnu- modules_prepare -j$(nproc)
          
          # Auto-detect any symvers file uploaded to the repository, or fallback to direct download
          if [ -f "$GITHUB_WORKSPACE/Module.symvers" ]; then
            cp "$GITHUB_WORKSPACE/Module.symvers" "$GITHUB_WORKSPACE/kernel/out/Module.symvers"
          elif [ -f "$GITHUB_WORKSPACE/vmlinux.symvers" ]; then
            cp "$GITHUB_WORKSPACE/vmlinux.symvers" "$GITHUB_WORKSPACE/kernel/out/Module.symvers"
          elif ls $GITHUB_WORKSPACE/*.symvers* 1> /dev/null 2>&1; then
            cp $GITHUB_WORKSPACE/*.symvers* "$GITHUB_WORKSPACE/kernel/out/Module.symvers"
          else
            echo "No uploaded symvers found, fetching from Android prebuilts..."
            curl -sSL "https://android.googlesource.com/kernel/prebuilts/5.15/arm64/+/refs/heads/main/Module.symvers?format=TEXT" | base64 -d > "$GITHUB_WORKSPACE/kernel/out/Module.symvers"
          fi

          - name: Build RTL8188EUS Module
          run: |
          export PATH=$GITHUB_WORKSPACE/clang/bin:$PATH
          cd $GITHUB_WORKSPACE/rtl8188eus
          make ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-gnu- \
            KSRC=$GITHUB_WORKSPACE/kernel/out \
            CONFIG_PLATFORM_I386_PC=n \
            CONFIG_PLATFORM_ARM_AARCH64=y \
            CONFIG_PLATFORM_ARM64=y \
            CONFIG_LITTLE_ENDIAN=y \
            USER_EXTRA_CFLAGS="-DCONFIG_LITTLE_ENDIAN -Wno-error -Wno-unused-variable -Wno-parentheses-equality -Wno-undef" \
            EXTRA_CFLAGS="-DCONFIG_LITTLE_ENDIAN -Wno-error -Wno-unused-variable -Wno-parentheses-equality -Wno-undef" \
            -j$(nproc)

      - name: Upload Module Artifact
        uses: actions/upload-artifact@v4
        with:
          name: 8188eu-gki-5.15.ko
          path: ${{ github.workspace }}/rtl8188eus/8188eu.ko
