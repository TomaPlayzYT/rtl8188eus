name: Build RTL8188EUS Android driver

on:
  workflow_dispatch:
    inputs:
      kernel_repo:
        description: "Moto G77 kernel source repository URL"
        required: true
        type: string

      kernel_ref:
        description: "Moto G77 kernel branch or tag"
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout rtl8188eus
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            clang \
            flex \
            gcc-aarch64-linux-gnu \
            git \
            libelf-dev \
            libssl-dev \
            lld \
            llvm \
            make \
            python3 \
            dwarves

      - name: Clone Moto G77 kernel
        env:
          KERNEL_REPO: ${{ inputs.kernel_repo }}
          KERNEL_REF: ${{ inputs.kernel_ref }}
        run: |
          git clone --depth=1 \
            --branch "$KERNEL_REF" \
            "$KERNEL_REPO" \
            kernel

      - name: Validate kernel source
        run: |
          set -e

          test -f kernel/Makefile || {
            echo "Kernel Makefile not found."
            exit 1
          }

          test -f kernel/arch/arm64/configs/* || {
            echo "No ARM64 kernel configuration was found."
            exit 1
          }

      - name: Select kernel configuration
        run: |
          set -e

          cd kernel

          CONFIG=$(find arch/arm64/configs -maxdepth 1 -type f \
            \( -iname '*defconfig*' -o -iname '*gki*' \) \
            | head -n 1)

          if [ -z "$CONFIG" ]; then
            echo "No suitable defconfig found."
            echo "Select the Moto G77 defconfig manually in this workflow."
            exit 1
          fi

          DEFCONFIG=$(basename "$CONFIG")
          echo "Using defconfig: $DEFCONFIG"

          make \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            "$DEFCONFIG"

      - name: Enable required wireless framework
        run: |
          set -e

          cd kernel

          if [ ! -x scripts/config ]; then
            echo "scripts/config is unavailable."
            exit 1
          fi

          ./scripts/config --enable CONFIG_WLAN
          ./scripts/config --enable CONFIG_CFG80211
          ./scripts/config --enable CONFIG_MAC80211
          ./scripts/config --enable CONFIG_USB
          ./scripts/config --enable CONFIG_WLAN_VENDOR_REALTEK

          make \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            olddefconfig

          echo "=== Wireless configuration ==="
          grep -E \
            'CONFIG_(WLAN|CFG80211|MAC80211|WLAN_VENDOR_REALTEK)' \
            .config || true

          grep -q '^CONFIG_CFG80211=y' .config || {
            echo "CONFIG_CFG80211 is not enabled."
            exit 1
          }

          grep -q '^CONFIG_MAC80211=y' .config || {
            echo "CONFIG_MAC80211 is not enabled."
            exit 1
          }

      - name: Prepare kernel tree
        run: |
          set -e

          make \
            -C kernel \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            modules_prepare

      - name: Build RTL8188EUS driver
        run: |
          set -e

          KERNEL_DIR="$GITHUB_WORKSPACE/kernel"
          KERNEL_RELEASE=$(make -s -C "$KERNEL_DIR" \
            ARCH=arm64 \
            LLVM=1 \
            kernelrelease)

          echo "Kernel release: $KERNEL_RELEASE"

          make \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            KSRC="$KERNEL_DIR" \
            KVER="$KERNEL_RELEASE" \
            -j"$(nproc)"

      - name: Locate built module
        run: |
          set -e

          find . -type f -name '*.ko' -print

          MODULE=$(find . -type f \
            \( -name '8188eu.ko' -o -name 'r8188eu.ko' \) \
            | head -n 1)

          if [ -z "$MODULE" ]; then
            echo "No RTL8188EUS kernel module was built."
            exit 1
          fi

          mkdir -p output
          cp "$MODULE" output/8188eu.ko

          echo "Built module:"
          file output/8188eu.ko

          echo "Module architecture:"
          readelf -h output/8188eu.ko | \
            grep -E 'Class|Machine'

      - name: Package module
        run: |
          set -e

          mkdir -p output/system/etc/firmware/rtlwifi

          cp -r \
            /dev/null \
            output/ignore 2>/dev/null || true

          find . -type f \
            -path '*firmware*' \
            -name 'rtl8188*' \
            -exec cp {} output/system/etc/firmware/rtlwifi/ \; \
            || true

          printf '%s\n' \
            'RTL8188EUS Android kernel module' \
            'Target: Moto G77 arm64' \
            'Do not load unless kernel release and vermagic match.' \
            > output/README.txt

      - name: Upload driver artifact
        uses: actions/upload-artifact@v4
        with:
          name: rtl8188eus-moto-g77
          path: output/
          if-no-files-found: error
