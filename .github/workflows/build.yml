name: Build 8188eu for Moto G77

on:
  workflow_dispatch:
    inputs:
      kernel_repo:
        description: "Moto G77 kernel source repository URL"
        required: true
        type: string

      kernel_ref:
        description: "Moto G77 kernel branch or tag"
        required: true
        type: string

      kernel_defconfig:
        description: "Kernel defconfig name"
        required: true
        default: "gki_defconfig"
        type: string

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout RTL8188EUS driver
        uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            clang \
            flex \
            gcc-aarch64-linux-gnu \
            git \
            libelf-dev \
            libssl-dev \
            lld \
            llvm \
            make \
            python3 \
            dwarves \
            zip

      - name: Clone Moto G77 kernel
        env:
          KERNEL_REPO: ${{ inputs.kernel_repo }}
          KERNEL_REF: ${{ inputs.kernel_ref }}
        run: |
          set -eux

          git clone \
            --depth=1 \
            --branch "$KERNEL_REF" \
            "$KERNEL_REPO" \
            kernel

          test -f kernel/Makefile

      - name: Configure kernel
        env:
          DEFCONFIG: ${{ inputs.kernel_defconfig }}
        run: |
          set -eux

          cd kernel

          make \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            "$DEFCONFIG"

          if [ ! -x scripts/config ]; then
            echo "scripts/config is missing"
            exit 1
          fi

          ./scripts/config --enable CONFIG_WLAN
          ./scripts/config --enable CONFIG_CFG80211
          ./scripts/config --enable CONFIG_MAC80211
          ./scripts/config --enable CONFIG_USB

          if grep -q "CONFIG_WLAN_VENDOR_REALTEK" \
            arch/arm64/configs/* 2>/dev/null || \
             grep -q "CONFIG_WLAN_VENDOR_REALTEK" .config; then
            ./scripts/config --enable CONFIG_WLAN_VENDOR_REALTEK
          fi

          make \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            olddefconfig

          echo "Kernel wireless configuration:"
          grep -E \
            "CONFIG_(WLAN|CFG80211|MAC80211|WLAN_VENDOR_REALTEK)" \
            .config || true

          grep -q "^CONFIG_CFG80211=y" .config
          grep -q "^CONFIG_MAC80211=y" .config

      - name: Prepare kernel
        run: |
          set -eux

          make \
            -C kernel \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            modules_prepare

      - name: Build RTL8188EUS module
        run: |
          set -eux

          KERNEL_DIR="$GITHUB_WORKSPACE/kernel"
          KERNEL_RELEASE="$(make -s -C "$KERNEL_DIR" \
            ARCH=arm64 \
            LLVM=1 \
            kernelrelease)"

          echo "Kernel release: $KERNEL_RELEASE"

          make \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            KSRC="$KERNEL_DIR" \
            KVER="$KERNEL_RELEASE" \
            -j"$(nproc)"

      - name: Find module
        run: |
          set -eux

          find . -type f -name "*.ko" -print

          MODULE="$(find . -type f \
            \( -name "8188eu.ko" -o -name "r8188eu.ko" \) \
            | head -n 1)"

          if [ -z "$MODULE" ]; then
            echo "No 8188eu kernel module was produced"
            exit 1
          fi

          mkdir -p output
          cp "$MODULE" output/8188eu.ko

          echo "Module information:"
          file output/8188eu.ko
          readelf -h output/8188eu.ko | grep -E "Class|Machine"

      - name: Copy firmware
        run: |
          set -eux

          mkdir -p output/firmware

          find . -type f \
            \( -name "rtl8188eufw.bin" \
            -o -name "rtl8188eufw.bin" \
            -o -name "rtl8188eufw_TMSC.bin" \) \
            -exec cp {} output/firmware/ \; || true

      - name: Create README
        run: |
          cat > output/README.txt <<'EOF'
          RTL8188EUS Android driver

          Target:
          - TP-Link TL-WN722N v3
          - ARM64
          - Moto G77 kernel

          Do not load this module unless its kernel release,
          vermagic, exported symbols, and configuration match
          the running phone kernel.
          EOF

      - name: Create ZIP
        run: |
          set -eux
          cd output
          zip -r ../rtl8188eus-moto-g77.zip .

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rtl8188eus-moto-g77
          path: |
            rtl8188eus-moto-g77.zip
            output/8188eu.ko
            output/README.txt
          if-no-files-found: error
