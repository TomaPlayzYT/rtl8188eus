name: Build 8188eu Driver Module

on:
  workflow_dispatch:
    inputs:
      kernel_ref:
        description: "Android common kernel branch or commit"
        required: true
        default: "android13-5.15"
      kernel_version:
        description: "Target kernel release string"
        required: true
        default: "5.15.189-android13-8-00018-g9c82b71884fd-ab14885418"

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            flex \
            gcc-aarch64-linux-gnu \
            git \
            libelf-dev \
            libssl-dev \
            wget

      - name: Fetch Android GKI kernel headers
        env:
          KERNEL_REF: ${{ inputs.kernel_ref }}
        run: |
          set -euo pipefail
          git clone --depth 1 \
            --branch "$KERNEL_REF" \
            https://android.googlesource.com/kernel/common \
            gki_headers

          make -C gki_headers \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            gki_defconfig

          make -C gki_headers \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            olddefconfig

          make -C gki_headers \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            prepare modules_prepare \
            -j"$(nproc)"

      - name: Fetch kernel-compatible driver source
        run: |
          set -euo pipefail
          rm -rf driver
          git clone https://github.com/aircrack-ng/rtl8188eus.git driver
          # Use tip of v5.3.9 (has 5.15/5.19/6.x guards)
          git -C driver checkout v5.3.9

          # Disable x86 platform (avoids -mhard-float)
          sed -i 's/CONFIG_PLATFORM_I386_PC = y/CONFIG_PLATFORM_I386_PC = n/' driver/Makefile
          sed -i 's/CONFIG_PLATFORM_ARM64_RPI = n/CONFIG_PLATFORM_ARM64_RPI = y/' driver/Makefile

          # Android GKI 5.15 backported several post-5.19 cfg80211 APIs.
          # Lower the version gates so the driver matches the actual headers.
          CFG=driver/os_dep/linux/ioctl_cfg80211.c
          # ch_switch_notify / stop_ap / current_bss -> treated as >= 5.19
          sed -i 's/KERNEL_VERSION(5, 19, 0)/KERNEL_VERSION(5, 15, 0)/g' "$CFG"
          # key ops (add_key/get_key/del_key/set_default_*) link_id -> treated as >= 6.1
          sed -i 's/KERNEL_VERSION(6, 1, 0)/KERNEL_VERSION(5, 15, 0)/g' "$CFG"
          # roam_info.links[] (6.0+)
          sed -i 's/KERNEL_VERSION(6, 0, 0)/KERNEL_VERSION(5, 15, 0)/g' "$CFG"

      - name: Build driver module
        env:
          KERNEL_VERSION: ${{ inputs.kernel_version }}
        run: |
          set -euo pipefail
          make -C gki_headers \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            M="$GITHUB_WORKSPACE/driver" \
            KERNELRELEASE="$KERNEL_VERSION" \
            CONFIG_RTL8188EU=m \
            modules \
            -j"$(nproc)"

          echo "=== Driver directory after build ==="
          ls -la driver/ || true
          find driver -name '*.ko' -o -name '*.o' | head -50 || true

      - name: Verify module
        run: |
          set -euo pipefail
          if [ ! -f driver/8188eu.ko ]; then
            echo "ERROR: 8188eu.ko was not produced"
            echo "=== Remaining files in driver/ ==="
            ls -laR driver/ || true
            exit 1
          fi
          file driver/8188eu.ko
          modinfo -F vermagic driver/8188eu.ko || true

      - name: Upload 8188eu module
        uses: actions/upload-artifact@v4
        with:
          name: 8188eu-module-${{ inputs.kernel_version }}
          path: driver/8188eu.ko
          if-no-files-found: error