name: Build Android GKI 5.15 Module

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Build Dependencies
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            clang \
            lld \
            llvm \
            gcc-aarch64-linux-gnu \
            git

      - name: Fetch Motorola Kernel and Prepare Headers
        run: |
          set -eux
          git clone \
            --depth=1 \
            --branch android-16-release-w1wn36.18-114 \
            https://github.com/MotorolaMobilityLLC/kernel-mtk.git \
            kernel

          cd kernel
          make \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            gki_defconfig

          make \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            prepare \
            modules_prepare

      - name: Compile 8188eu.ko Module
        run: |
          set -eux
          make \
            -C "$GITHUB_WORKSPACE/kernel" \
            M="$GITHUB_WORKSPACE" \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            modules

      - name: Prepare Artifact
        run: |
          set -eux
          # Create an output directory to prevent file-copy collisions
          mkdir -p "$GITHUB_WORKSPACE/out"

          # Ignore the kernel folder so we don't accidentally grab a random MTK module
          MODULE="$(
            find "$GITHUB_WORKSPACE" \
              -path "$GITHUB_WORKSPACE/kernel" -prune -o \
              -type f \
              -name "8188eu.ko" \
              -print | head -n 1
          )"

          if [ -z "$MODULE" ]; then
            echo "No 8188eu.ko file was produced."
            exit 1
          fi

          echo "Found: $MODULE"
          cp "$MODULE" "$GITHUB_WORKSPACE/out/8188eu.ko"

      - name: Verify Module
        run: |
          set -eux
          test -f "$GITHUB_WORKSPACE/out/8188eu.ko"
          file "$GITHUB_WORKSPACE/out/8188eu.ko"

      - name: Upload 8188eu.ko Artifact
        uses: actions/upload-artifact@v4
        with:
          name: 8188eu-GKI-5.15
          path: out/8188eu.ko
          if-no-files-found: error
