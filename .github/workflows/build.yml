name: Fast Build RTL8188EUS for Android GKI 5.15

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
      - v5.3.9

jobs:
  build:
    name: Build Kernel Module
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          set -euxo pipefail

          sudo apt-get update
          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            curl \
            flex \
            git \
            libssl-dev \
            libelf-dev \
            unzip \
            python3 \
            crossbuild-essential-arm64 \
            kmod \
            cpio \
            lld \
            llvm

      - name: Download Clang
        run: |
          set -euxo pipefail

          git clone --depth=1 \
            https://github.com/kdrag0n/proton-clang \
            "$GITHUB_WORKSPACE/clang"

      - name: Clone GKI 5.15 Kernel Source
        run: |
          set -euxo pipefail

          git clone --depth=1 \
            -b android14-5.15 \
            https://android.googlesource.com/kernel/common \
            "$GITHUB_WORKSPACE/kernel"

      - name: Prepare Kernel Headers
        run: |
          set -euxo pipefail

          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"

          cd "$GITHUB_WORKSPACE/kernel"

          mkdir -p out

          make \
            O=out \
            ARCH=arm64 \
            CC=clang \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            gki_defconfig

          make \
            O=out \
            ARCH=arm64 \
            CC=clang \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            modules_prepare \
            -j"$(nproc)"

          echo
          echo "========================================"
          echo "Looking for Module.symvers"
          echo "========================================"

          SYMFILE=$(find "$GITHUB_WORKSPACE" \
            -maxdepth 4 \
            -name "Module.symvers" \
            -type f \
            | head -n 1)

          if [ -n "$SYMFILE" ]; then
            echo "Found Module.symvers at:"
            echo "$SYMFILE"
            cp "$SYMFILE" "$GITHUB_WORKSPACE/kernel/out/Module.symvers"
          else
            echo "No Module.symvers found in workspace."
            echo "Fetching Android 5.15 Module.symvers..."
            python3 - <<'PY'
import os
import base64
import urllib.request

url = (
    "https://android.googlesource.com/kernel/prebuilts/"
    "5.15/arm64/+/refs/heads/main/Module.symvers?format=TEXT"
)

output = os.path.join(
    os.environ["GITHUB_WORKSPACE"],
    "kernel",
    "out",
    "Module.symvers",
)

print(f"Downloading: {url}")
data = urllib.request.urlopen(url).read()
decoded = base64.b64decode(data)

with open(output, "wb") as f:
    f.write(decoded)

print(f"Saved Module.symvers to: {output}")
PY
          fi

          echo
          echo "========================================"
          echo "Module.symvers"
          echo "========================================"

          ls -lh "$GITHUB_WORKSPACE/kernel/out/Module.symvers"

      - name: Build RTL8188EUS Module
        run: |
          set -euxo pipefail

          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"

          cd "$GITHUB_WORKSPACE"

          echo "========================================"
          echo "Compiler"
          echo "========================================"

          which clang
          clang --version

          echo
          echo "========================================"
          echo "drv_types.h"
          echo "========================================"

          find . -name "drv_types.h" -print

          echo
          echo "========================================"
          echo "Building RTL8188EUS"
          echo "========================================"

          make clean || true

          make \
            ARCH=arm64 \
            CC=clang \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            -j"$(nproc)" \
            KSRC="$GITHUB_WORKSPACE/kernel/out" \
            CONFIG_PLATFORM_I386_PC=n \
            CONFIG_PLATFORM_ARM_RPI=n \
            CONFIG_PLATFORM_ARM64_RPI=n \
            CONFIG_PLATFORM_ANDROID_X86=n \
            CONFIG_PLATFORM_ANDROID_INTEL_X86=n \
            CONFIG_USB_HCI=y \
            CONFIG_PCI_HCI=n \
            CONFIG_SDIO_HCI=n \
            CONFIG_GSPI_HCI=n \
            CONFIG_RTL8188E=y \
            CONFIG_RTL8812A=n \
            CONFIG_RTL8821A=n \
            CONFIG_RTL8192E=n \
            CONFIG_RTL8723B=n \
            CONFIG_RTL8814A=n \
            CONFIG_RTL8723C=n \
            CONFIG_RTL8188F=n \
            CONFIG_RTL8822B=n \
            CONFIG_RTL8723D=n \
            CONFIG_RTL8821C=n \
            CONFIG_LITTLE_ENDIAN=y \
            EXTRA_CFLAGS="\
          -I$GITHUB_WORKSPACE \
          -I$GITHUB_WORKSPACE/include \
          -I$GITHUB_WORKSPACE/core \
          -I$GITHUB_WORKSPACE/hal \
          -I$GITHUB_WORKSPACE/os_dep \
          -I$GITHUB_WORKSPACE/platform \
          -DCONFIG_LITTLE_ENDIAN \
          -Wno-error \
          -Wno-unused-variable \
          -Wno-parentheses-equality \
          -Wno-undef"

      - name: Verify Module
        run: |
          set -euxo pipefail

          cd "$GITHUB_WORKSPACE"

          echo "========================================"
          echo "Searching for built module"
          echo "========================================"

          find . \
            -name "*.ko" \
            -type f \
            -print

          if [ ! -f "8188eu.ko" ]; then
            echo
            echo "ERROR: 8188eu.ko was not produced."
            exit 1
          fi

          echo
          echo "========================================"
          echo "Module information"
          echo "========================================"

          modinfo ./8188eu.ko || true

          echo
          echo "========================================"
          echo "Module file"
          echo "========================================"

          ls -lh ./8188eu.ko
          file ./8188eu.ko

      - name: Upload Module Artifact
        uses: actions/upload-artifact@v4
        with:
          name: 8188eu-gki-5.15
          path: ${{ github.workspace }}/8188eu.ko
          if-no-files-found: error
