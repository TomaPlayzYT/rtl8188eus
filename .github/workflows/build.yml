name: Build RTL8188EUS for Android GKI 5.15

on:
  workflow_dispatch: # Allows you to manually trigger the build from the Actions tab
  push:
    branches:
      - main
      - master

jobs:
  build:
    name: Build Kernel Module
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential curl flex git libssl-dev \
          libelf-dev unzip wget python3 crossbuild-essential-arm64 kmod cpio lld llvm

      - name: Download Android Clang Toolchain
        run: |
          mkdir -p $GITHUB_WORKSPACE/clang
          cd $GITHUB_WORKSPACE/clang
          echo "Downloading AOSP Clang 17 (r487747c)..."
          # We use the exact Clang version used by Google for recent GKI 5.15 builds
          wget -qO clang.tar.gz https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r487747c.tar.gz
          tar -xf clang.tar.gz
          rm clang.tar.gz

      - name: Clone GKI 5.15 Kernel Source
        run: |
          echo "Cloning Android GKI 5.15 Source..."
          # The android14-5.15 branch tracks the latest 5.15.x GKI releases
          git clone --depth 1 -b android14-5.15 https://android.googlesource.com/kernel/common $GITHUB_WORKSPACE/kernel

      - name: Clone RTL8188EUS Source
        run: |
          echo "Cloning SimplyCEO RTL8188EUS Repository..."
          git clone --depth 1 https://gitlab.com/SimplyCEO/rtl8188eus.git $GITHUB_WORKSPACE/rtl8188eus

      - name: Build GKI Kernel (Prepare Headers & Symvers)
        run: |
          export PATH=$GITHUB_WORKSPACE/clang/bin:$PATH
          cd $GITHUB_WORKSPACE/kernel
          
          mkdir -p out
          
          # 1. Configure the kernel for GKI ARM64
          make O=out ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-gnu- gki_defconfig
          
          # 2. Build the kernel (This takes ~45 mins on GitHub Actions)
          # This step is mandatory because OOT modules need a fully generated Module.symvers to load without "exec format error"
          make O=out ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-gnu- -j$(nproc)

      - name: Build RTL8188EUS Module
        run: |
          export PATH=$GITHUB_WORKSPACE/clang/bin:$PATH
          cd $GITHUB_WORKSPACE/rtl8188eus
          
          # Build the Wi-Fi module
          # We pass overrides (CONFIG_PLATFORM_I386_PC=n etc.) to force the Makefile to build for ARM64 Android instead of a standard PC
          make ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-gnu- \
            KSRC=$GITHUB_WORKSPACE/kernel/out \
            CONFIG_PLATFORM_I386_PC=n \
            CONFIG_PLATFORM_ARM_AARCH64=y \
            CONFIG_PLATFORM_ARM64=y \
            -j$(nproc)

      - name: Upload Module Artifact
        uses: actions/upload-artifact@v4
        with:
          name: 8188eu-gki-5.15.ko
          path: ${{ github.workspace }}/rtl8188eus/8188eu.ko
